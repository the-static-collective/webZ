name: CIRCULATION-003 field-kit proof
on:
  pull_request:
    paths:
      - 'circulation/003/**'
      - 'circulation/index.html'
      - 'tests/circulation-003.test.mjs'
      - 'scripts/build-release.mjs'
      - '.github/workflows/circulation-003.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  field-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Standalone privacy, permission and 8x10 sheet tests
        run: node --test tests/circulation-003.test.mjs
      - name: Existing webZ regression suite
        run: npm test
      - name: Verify original immutable field assets remain source-exact
        run: npm run field:verify
      - name: Build isolated public release from exact commit
        run: npm run build
      - name: Verify full release hashes
        run: node scripts/verify-release.mjs dist
      - name: Confirm 003 route exported and root worker unchanged
        run: |
          test -s dist/circulation/003/index.html
          test -s dist/circulation/003/style.css
          test -s dist/circulation/003/app.mjs
          test -s dist/circulation/003/packet.mjs
          git diff --exit-code -- sw.js
