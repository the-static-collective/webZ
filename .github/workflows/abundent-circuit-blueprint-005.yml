name: Abundent Circuit 005 — Measured Blueprint to Native Minecraft
on:
  pull_request:
    paths:
      - 'pilots/abundent-circuit-001/blueprint_foundry/**'
      - '.github/workflows/abundent-circuit-blueprint-005.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blueprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pure Python measured-plan geometry, archive format and security tests
        run: |
          python3 -m unittest discover -s pilots/abundent-circuit-001/blueprint_foundry/tests -p 'test_*.py' -v
          python3 pilots/abundent-circuit-001/blueprint_foundry/generate.py \
            pilots/abundent-circuit-001/blueprint_foundry/example_12x8_workshop.json \
            --output /tmp/abundent-test-blueprint.zip
      - name: Prepare official Minecraft JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
      - name: Download official Mojang Java 26.1.1 server and verify its published SHA-1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,urllib.request
          d=Path('/tmp/abundent-vanilla-server');d.mkdir(parents=True,exist_ok=True)
          v=json.load(urllib.request.urlopen('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json',timeout=20))
          item=next(x for x in v['versions'] if x['id']=='26.1.1')
          details=json.load(urllib.request.urlopen(item['url'],timeout=20))
          server=details['downloads']['server']
          b=urllib.request.urlopen(server['url'],timeout=60).read()
          assert hashlib.sha1(b).hexdigest()==server['sha1'],'Official Mojang server SHA-1 mismatch'
          (d/'server.jar').write_bytes(b)
          print('OFFICIAL_MOJANG_26_1_1_SHA1_VERIFIED',server['sha1'])
          PY
      - name: Configure disposable flat world with blueprint datapack before first boot
        run: |
          set -euo pipefail
          cd /tmp/abundent-vanilla-server
          mkdir -p world/datapacks
          cp /tmp/abundent-test-blueprint.zip world/datapacks/Abundent_Blueprint_005.zip
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          server-port=25565
          online-mode=false
          enforce-secure-profile=false
          gamemode=creative
          force-gamemode=true
          difficulty=peaceful
          spawn-protection=0
          generate-structures=false
          level-type=minecraft:flat
          view-distance=5
          simulation-distance=5
          allow-flight=true
          enable-rcon=true
          rcon.port=25575
          rcon.password=blueprint-ci-only-not-production
          enable-query=false
          motd=ABUNDENT-005-DISPOSABLE
          EOF
      - name: Start fresh official Minecraft Java server
        run: |
          set -euo pipefail
          cd /tmp/abundent-vanilla-server
          java -Xms512M -Xmx2G -jar server.jar nogui > minecraft.log 2>&1 &
          echo $! > pid
          for i in $(seq 1 100); do
            if grep -q 'Done (' minecraft.log; then echo 'OFFICIAL SERVER READY';exit 0;fi
            if ! kill -0 "$(cat pid)" 2>/dev/null; then cat minecraft.log;exit 1;fi
            sleep 1
          done
          tail -100 minecraft.log;exit 1
      - name: Execute the generated function and independently query its real block states
        run: |
          python3 pilots/abundent-circuit-001/blueprint_foundry/tests/real_minecraft.py
      - name: Preserve human-readable evidence, never Mojang server binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: circuit005-blueprint-real-minecraft-receipt
          path: /tmp/abundent-vanilla-server/minecraft.log
          if-no-files-found: warn
          retention-days: 7
