name: Reconcile Commons 031 immutable shell
on:
  push:
    branches: [feature/abundent-public-commons-031]
    paths: [.github/workflows/commons-artifacts-031.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Regenerate deterministic field receipts and PWA shell after homepage change
        run: npm run field:build
      - name: Commit only generated tracked assets
        run: |
          git add sw.js field/index.html field/public-field-receipt.json
          if git diff --cached --quiet; then
            echo "Already current"
          else
            git -c user.name='static-collective-bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(commons): reconcile immutable offline shell'
            git push origin HEAD:feature/abundent-public-commons-031
          fi
