name: Offline portal verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run field:verify
      - run: npm run build
      - run: node scripts/verify-release.mjs dist
      - name: Reproducible export
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/first-build.sha256
          npm run build
          sha256sum -c /tmp/first-build.sha256
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:browser
      - run: WEBZ_TEST_SITE=dist WEBZ_WITNESS_NAME=export python tests/navigator_browser.py
      - run: npm run replay -- evidence/browser/voyage.frozen.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-browser-witness
          path: |
            evidence/browser/
            evidence/static-web-001/browser/
            evidence/abundent-launch-001/
