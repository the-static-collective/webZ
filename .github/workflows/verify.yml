name: Offline portal verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run field:verify
      - run: npm run field:replay
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run replay -- evidence/browser/voyage.frozen.json
      - uses: actions/upload-artifact@v4
        with:
          name: offline-browser-witness
          path: |
            evidence/browser/
            evidence/static-web-001/browser/
            evidence/static-web-002/
