name: Abundent Circuit 002 — Native GHoT
on:
  pull_request:
    paths:
      - 'pilots/abundent-circuit-001/**'
      - '.github/workflows/abundent-circuit-native-ghot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-donor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: the-static-collective/GHoT
          ref: 9748a0772c4a13135421c4fa84a9991e0a51e05f
          path: native-ghot-donor
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Circuit core contracts
        run: node --test pilots/abundent-circuit-001/tests/circuit.test.js
      - name: Reproducible single-file UI bundle
        working-directory: pilots/abundent-circuit-001
        run: |
          python build.py
          git diff --exit-code -- Abundent_Circuit_001_Offline.html
      - name: Cross-repository REAL GHoT native execution + HTTP negative cases
        env:
          GHOT_REPO: ${{ github.workspace }}/native-ghot-donor
        run: python3 -m unittest discover -s pilots/abundent-circuit-001/tests -p test_native_ghot.py -v
      - name: Install browser smoke dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Native GHoT / full browser roundtrip + persistence
        env:
          GHOT_REPO: ${{ github.workspace }}/native-ghot-donor
        run: python3 pilots/abundent-circuit-001/tests/browser_native_ghot.py
