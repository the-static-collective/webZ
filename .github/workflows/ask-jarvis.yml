name: Ask JAR;VIS - deterministic source-first contract
on:
  push:
    branches: [feature/ask-jarvis-1999]
    paths:
      - 'ask-jarvis/**'
      - '.github/workflows/ask-jarvis.yml'
  pull_request:
    paths:
      - 'ask-jarvis/**'
      - '.github/workflows/ask-jarvis.yml'
permissions:
  contents: read
jobs:
  source-first-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify bounded Worker and front-end syntax
        run: |
          node --version
          node --check ask-jarvis/src/worker.mjs
          node --check ask-jarvis/public/app.mjs
          node --check ask-jarvis/public/games/tomorrow/key.mjs
          node --check ask-jarvis/public/games/tomorrow/town/world.mjs
          node --check ask-jarvis/public/games/tomorrow/town/app.mjs
          node --check ask-jarvis/public/games/tomorrow/town/alchematrix-core.mjs
      - name: Verify actual Worker contract
        run: node --test ask-jarvis/test/worker.test.mjs ask-jarvis/test/tomorrow.test.mjs ask-jarvis/test/tomorrow-town.test.mjs
      - name: Smoke hosted 1999 question-to-artifact proof
        run: node ask-jarvis/test/smoke-preview.mjs
      - name: Assert no Cloudflare Worker custom route
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("ask-jarvis/wrangler.jsonc","utf8"));if(c.routes||c.route)process.exit(1); if(c.assets?.directory!=="./public")process.exit(1);'
