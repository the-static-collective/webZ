name: Field nav cache version review
on:
  push:
    branches: [release/field-cards-reconciled-001]
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Regenerate and report exact reviewed public cache version
        run: |
          npm run field:build
          grep -m1 '^const root=' sw.js
