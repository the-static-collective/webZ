name: Music Rooms and 11-Lens Zoom
on:
  pull_request:
    paths:
      - 'music/rooms/**'
      - 'week/**'
      - 'scripts/build-release.mjs'
      - 'tests/music-rooms.test.mjs'
      - '.github/workflows/music-rooms.yml'
permissions:
  contents: read
jobs:
  source-and-zoom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --check music/rooms/rooms.mjs
      - run: node --check week/week.mjs
      - run: node --test tests/music-rooms.test.mjs tests/album-universe.test.mjs tests/week.test.mjs
