name: Abundent Circuit 004 — native Minecraft Java + GHoT
on:
  pull_request:
    paths:
      - 'pilots/abundent-circuit-001/**'
      - '.github/workflows/abundent-circuit-minecraft-004.yml'
  push:
    branches:
      - feat/abundent-circuit-004-minecraft-festival-foundry
    paths:
      - 'pilots/abundent-circuit-001/**'
      - '.github/workflows/abundent-circuit-minecraft-004.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-vanilla:
    name: Real official Java server / independent donor
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: the-static-collective/GHoT
          ref: 9748a0772c4a13135421c4fa84a9991e0a51e05f
          path: native-ghot-donor
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Core tests, local MC rules and HTTP refusal
        run: |
          node --test pilots/abundent-circuit-001/tests/circuit.test.js
          python3 -m unittest discover -s pilots/abundent-circuit-001/tests -p test_minecraft_foundry.py -v
          python3 pilots/abundent-circuit-001/build.py
          git diff --exit-code -- pilots/abundent-circuit-001/Abundent_Circuit_001_Offline.html
      - name: Download OFFICIAL vanilla 26.1.1 server and verify SHA-1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json,hashlib,pathlib
          root=pathlib.Path('work/circuit004/server');root.mkdir(parents=True,exist_ok=True)
          with urllib.request.urlopen('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json',timeout=30) as req:
            index=json.load(req)
          listing=next((v for v in index['versions'] if v['id']=='26.1.1'),None)
          if not listing:raise RuntimeError('Official Mojang 26.1.1 absent; do not substitute unknown jar.')
          with urllib.request.urlopen(listing['url'],timeout=30) as req:version=json.load(req)
          jar=version['downloads']['server']
          with urllib.request.urlopen(jar['url'],timeout=90) as req:raw=req.read()
          assert len(raw)==jar['size']
          assert hashlib.sha1(raw).hexdigest()==jar['sha1']
          (root/'server.jar').write_bytes(raw)
          (root/'version.json').write_text(json.dumps({'id':version['id'],'sha1':jar['sha1'],'size':jar['size']},indent=2))
          print('Official Minecraft server integrity verified, version',version['id'])
          PY
      - name: Configure disposable, localhost-only Creative rehearsal world
        run: |
          set -euo pipefail
          PWD_RCON="$(python3 -c 'import secrets;print(secrets.token_hex(20))')"
          echo "ABUNDENT_MC_RCON_PASSWORD=$PWD_RCON" >> "$GITHUB_ENV"
          cat > work/circuit004/server/server.properties <<EOF
          server-ip=127.0.0.1
          server-port=25565
          online-mode=false
          enforce-secure-profile=false
          gamemode=creative
          force-gamemode=true
          difficulty=peaceful
          generate-structures=false
          level-type=minecraft:flat
          level-seed=381654729
          spawn-protection=0
          view-distance=6
          simulation-distance=6
          enable-rcon=true
          rcon.port=25575
          rcon.password=$PWD_RCON
          motd=ABUNDENT-CIRCUIT-004-EPHEMERAL-LOCALONLY
          EOF
          echo eula=true > work/circuit004/server/eula.txt
      - name: Launch fresh official Minecraft Java server
        run: |
          set -euo pipefail
          cd work/circuit004/server
          java -Xms512M -Xmx2G -jar server.jar nogui > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log; then
              echo 'Native official Minecraft server ready'
              exit 0
            fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo 'Minecraft server exited prematurely'
              sed -E 's/(password=).*/\1[hidden]/' server.log | tail -70
              exit 1
            fi
            sleep 1
          done
          echo 'Native Minecraft server startup timed out'
          exit 1
      - name: Verify native Minecraft redstone, game seal, real GHoT receipt
        env:
          GHOT_REPO: ${{ github.workspace }}/native-ghot-donor
          GHOT_HOME: ${{ runner.temp }}/circuit-004-ghot
          MC_PROOF_OUT: work/circuit004/circuit004-proof.json
        run: python3 pilots/abundent-circuit-001/tests/ci_real_minecraft.py
      - name: Install pinned headless Chromium for full Circuit 004 browser integration
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Actual Chromium UI / fake-world refusal / native GHoT donor
        env:
          GHOT_REPO: ${{ github.workspace }}/native-ghot-donor
        run: python3 pilots/abundent-circuit-001/tests/browser_minecraft_004.py
      - name: Upload public-safe evidence (never server.properties, RCON key, world files)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: circuit004-game-evidence
          path: |
            work/circuit004/circuit004-proof.json
            work/circuit004/server/version.json
          if-no-files-found: warn
          retention-days: 7
