# Vendor-independent build: publishes the reviewed main-branch static site to GitHub Pages.
# Requires Pages enabled with GitHub Actions as the repository's Pages source.
# Does not change custom domains, DNS or the current Vercel production deployment.
name: Abundent portable static release

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/abundent-portable-static.yml'
  workflow_dispatch:
    inputs:
      publish_to_pages:
        description: 'Publish to GitHub Pages after the repository Pages source has been configured'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: abundent-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout checked-in source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify switchboard contract
        run: npm --prefix apps test
      - name: Build self-contained static publication
        run: npm --prefix apps run build
      - name: Validate publish tree
        run: |
          set -eu
          test -f apps/dist/index.html
          test -f apps/dist/main.mjs
          test -f apps/dist/manifest.mjs
          test -f apps/dist/style.css
          test -f apps/dist/commons/index.html
          test -f apps/dist/commons/main.mjs
          test -f apps/dist/commons/exchange.mjs
          test -f apps/dist/commons/style.css
          test -f apps/dist/commons/receiver/index.html
          test -f apps/dist/commons/receiver/receiver-ui.mjs
          test -f apps/dist/commons/receiver-protocol.mjs
          test -f apps/dist/commons/inbox/index.html
          test -f apps/dist/commons/inbox/inbox.mjs
          test -f apps/dist/commons/inbox/inbox.css
          test ! -e apps/dist/.env
      - name: Save provider-independent site bundle
        uses: actions/upload-artifact@v4
        with:
          name: abundent-static-switchboard
          path: apps/dist/
          if-no-files-found: error
          retention-days: 30
  publish-pages:
    # Owner enabled GitHub Actions as the Pages source. Build and publish reviewed main on push;
    # manual dispatch remains an explicit fallback. DNS cutover is an independent decision.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_pages))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: abundent-static-switchboard
          path: _site
      - uses: actions/configure-pages@v5
      - name: Verify the registered GitHub Pages custom domain
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_PAGES_CNAME: apps.abundent.org
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname // ""')"
          echo "GitHub Pages configured custom domain: ${actual:-<none>}"
          if [ -z "$actual" ]; then
            echo "::warning::GitHub Pages has no registered custom domain. Publish the independent github.io backup, but do not point apps.abundent.org DNS to GitHub yet."
          elif [ "$actual" != "$REQUIRED_PAGES_CNAME" ]; then
            echo "::error::GitHub Pages currently points to an unexpected custom domain. Verify GitHub Pages Settings before publishing."
            exit 1
          else
            echo "GitHub Pages custom domain is correctly registered."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish reviewed static artifact
        id: deploy
        uses: actions/deploy-pages@v4
